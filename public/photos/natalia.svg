<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2f52"/>
      <stop offset="100%" stop-color="#162340"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(27,42,74,0)"/>
      <stop offset="100%" stop-color="rgba(10,16,30,0.5)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- Silhouette — person from behind, professional -->
  <!-- Body/torso -->
  <path d="M 40 205 Q 42 155 65 140 Q 80 133 100 131 Q 120 133 135 140 Q 158 155 160 205 Z"
        fill="#0f1a2e" opacity="0.92"/>
  <!-- Neck -->
  <rect x="87" y="96" width="26" height="22" rx="4" fill="#0f1a2e" opacity="0.92"/>
  <!-- Head -->
  <ellipse cx="100" cy="72" rx="30" ry="34" fill="#0f1a2e" opacity="0.92"/>
  <!-- Hair hint — slightly lighter to distinguish -->
  <ellipse cx="100" cy="51" rx="30" ry="14" fill="#151f33" opacity="0.9"/>

  <!-- Subtle vignette -->
  <rect width="200" height="200" fill="url(#vignette)"/>

  <!-- Gold subtle light from above -->
  <ellipse cx="100" cy="0" rx="80" ry="40" fill="rgba(201,168,76,0.07)"/>
</svg>
